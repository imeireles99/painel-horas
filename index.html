<body><div id="app"><div class="loading" role="status"><span class="loading-mark">b</span>Carregando seus apontamentos…</div></div><script>(async()=>{const parseDate=s=>new Date(s+'T12:00:00Z');
const iso=d=>d.toISOString().slice(0,10);
function addDays(s,n){const d=parseDate(s);d.setUTCDate(d.getUTCDate()+n);return iso(d)}
function monday(s){const d=parseDate(s);return addDays(s,-((d.getUTCDay()+6)%7))}
function monthEnd(s){const d=parseDate(s+'-01');return iso(new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0,12)))}
function monthWeeks(month){const first=month+'-01',end=monthEnd(month),out=[];for(let day=monday(first);day<=end;day=addDays(day,7)){out.push({start:day<first?first:day,end:addDays(day,6)>end?end:addDays(day,6),label:`${out.length+1}ª semana`})}return out}
function contextRows(data,project,disc=[]){return data.rows.filter(r=>(project===''||r[1]===Number(project))&&(!disc.length||disc.includes(r[2])))}
const periodRows=(rows,start,end)=>rows.filter(r=>r[0]>=start&&r[0]<=end);
const sumHours=rows=>rows.reduce((s,r)=>s+r[3],0)/1e6;
const countRecords=rows=>rows.reduce((s,r)=>s+r[4],0);
function groupHours(rows,column){const m=new Map();for(const r of rows)m.set(r[column],(m.get(r[column])||0)+r[3]);return [...m.entries()].map(([key,micro])=>({key,hours:micro/1e6})).sort((a,b)=>b.hours-a.hours)}
function weekly(rows,start){return Array.from({length:7},(_,i)=>{const date=addDays(start,i);return {date,hours:sumHours(rows.filter(r=>r[0]===date))}})}
function monthly(rows,month){return monthWeeks(month).map(w=>({...w,hours:sumHours(periodRows(rows,w.start,w.end))}))}

const root=document.getElementById('app');
const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5Zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h6"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/>',reset:'<path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',bars:'<path d="M4 20h16M6 16V9M12 16V4M18 16v-5"/>'};
const icon=name=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.grid}</svg>`;
const escape=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const nf=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),integer=new Intl.NumberFormat('pt-BR'),short=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
const date=s=>s.split('-').reverse().join('/');
const dayMonth=s=>date(s).slice(0,5);
const monthLabel=s=>new Date(s+'-01T12:00:00Z').toLocaleDateString('pt-BR',{month:'long',year:'numeric',timeZone:'UTC'});
const sigla=s=>s==='Sem disciplina'?'SD':s.split(' - ')[0];
const discName=s=>s.includes(' - ')?s.split(' - ').slice(1).join(' - '):s;
let data,state;
let page=1,search='';const pageSize=15;
function defaults(){return {project:'',start:data.minDate,end:data.maxDate,disc:[],week:monday(data.maxDate),month:data.maxDate.slice(0,7)}}
function loadState(){const p=new URLSearchParams(location.search),s=defaults();if(p.has('projeto')&&data.projects.includes(p.get('projeto')))s.project=String(data.projects.indexOf(p.get('projeto')));for(const [key,param] of [['start','inicio'],['end','fim'],['week','semana']]){const v=p.get(param);if(v&&/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(new Date(v).getTime()))s[key]=key==='week'?monday(v):v}if(/^\d{4}-\d{2}$/.test(p.get('mes')||''))s.month=p.get('mes');const disc=p.get('disciplinas');if(disc)s.disc=disc.split(',').map(c=>data.disciplines.findIndex(d=>sigla(d)===c)).filter(i=>i>=0);return s}
function saveState(){const p=new URLSearchParams();if(state.project!=='')p.set('projeto',data.projects[Number(state.project)]);if(state.start!==data.minDate)p.set('inicio',state.start);if(state.end!==data.maxDate)p.set('fim',state.end);if(state.disc.length)p.set('disciplinas',state.disc.map(i=>sigla(data.disciplines[i])).join(','));if(state.week!==monday(data.maxDate))p.set('semana',state.week);if(state.month!==data.maxDate.slice(0,7))p.set('mes',state.month);(()=>{try{history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')+location.hash)}catch{}})()}
function horizontal(groups,kind){if(!groups.length)return empty('Nenhum apontamento neste período.');const max=Math.max(...groups.map(g=>g.hours),1);return `<div class="horizontal-bars" aria-label="Horas por ${kind==='project'?'projeto':'disciplina'}">${groups.map(g=>{const name=kind==='project'?data.projects[g.key]:data.disciplines[g.key];return `<button class="horizontal-bar" data-action="${kind}" data-value="${g.key}" title="${escape(name)}: ${nf.format(g.hours)} h" aria-label="${escape(name)}, ${nf.format(g.hours)} horas. ${kind==='project'?'Abrir projeto':'Filtrar disciplina'}"><span class="horizontal-label">${escape(kind==='project'?name:discName(name))}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${g.hours/max*100}%"></span></span><span class="horizontal-value">${short.format(g.hours)} h</span></button>`}).join('')}</div>`}
function empty(text){return `<div class="no-data">${icon('bars')}<span>${text}</span></div>`}
function columns(values,kind){const max=Math.max(...values.map(v=>v.hours),0),scale=max>0?max*1.2:1;const weekdays=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];return `<div class="v-chart" role="img" aria-label="${escape(values.map((v,i)=>(kind==='week'?weekdays[i]:v.label)+': '+nf.format(v.hours)+' horas').join('; '))}"><div class="y-axis">${[1,.75,.5,.25,0].map(i=>`<span>${short.format(scale*i)} h</span>`).join('')}</div><div class="plot"><div class="gridlines">${Array(5).fill('<i></i>').join('')}</div><div class="columns" style="--columns:${values.length}">${values.map((v,i)=>`<div class="column" title="${kind==='week'?date(v.date):date(v.start)+' a '+date(v.end)}: ${nf.format(v.hours)} h"><div class="col-body" style="--height:${v.hours/scale*100}%"><span class="col-value">${short.format(v.hours)}</span><div class="col-bar"></div></div><div class="col-label">${kind==='week'?weekdays[i]:v.label}<small>${kind==='week'?dayMonth(v.date):dayMonth(v.start)+'–'+dayMonth(v.end)}</small></div></div>`).join('')}</div></div></div>`}
function render(){const active=document.activeElement?.id,selection=document.activeElement?.selectionStart;saveState();const ctx=contextRows(data,state.project,state.disc),valid=state.start&&state.end&&state.start<=state.end;const rows=valid?periodRows(ctx,state.start,state.end):[];const hours=sumHours(rows),records=countRecords(rows),discCount=new Set(rows.map(r=>r[2])).size;const available=[...new Set(contextRows(data,state.project).map(r=>r[2]))].sort((a,b)=>data.disciplines[a].localeCompare(data.disciplines[b],'pt-BR'));const project=state.project===''?'Visão geral':data.projects[Number(state.project)];const weekData=weekly(ctx,state.week),monthData=monthly(ctx,state.month);const weekTotal=weekData.reduce((s,v)=>s+v.hours,0),monthTotal=monthData.reduce((s,v)=>s+v.hours,0);let weeks=[];const today=new Date().toLocaleDateString('en-CA');let lastMonday=monday(today>data.maxDate?today:data.maxDate);for(let d=lastMonday;d>=monday(data.minDate);d=addDays(d,-7))weeks.push(d);if(!weeks.includes(state.week))weeks.push(state.week);weeks.sort().reverse();let months=[];for(let d=data.minDate.slice(0,7)+'-01';d<=data.maxDate;){months.push(d.slice(0,7));let dt=new Date(d+'T12:00:00Z');dt.setUTCMonth(dt.getUTCMonth()+1);d=dt.toISOString().slice(0,10)}if(!months.includes(state.month))months.push(state.month);months.sort().reverse();const periodDays=new Set(rows.map(r=>r[0])).size;const selectedLabel=state.disc.length?state.disc.map(i=>sigla(data.disciplines[i])).join(' + '):'Todas as disciplinas';

<main class="main"><header class="topbar"><div><p class="eyebrow">Gestão de horas</p><h1>${state.project===''?'Controle de horas':project}</h1><p class="subtitle">${state.project===''?'Todos os projetos, em uma só visão.':'Acompanhamento de horas e apontamentos do projeto.'}</p></div><div class="data-stamp">${icon('calendar')}<div>Último apontamento<strong>${date(data.maxDate)}</strong></div></div></header>
<section class="toolbar" aria-label="Filtro do período"><div class="date-pair"><label class="date-field"><span class="field-label">Data inicial</span><input type="date" id="start" value="${state.start}" min="${data.minDate}" max="${data.maxDate}" aria-describedby="period-error"></label><label class="date-field"><span class="field-label">Data final</span><input type="date" id="end" value="${state.end}" min="${data.minDate}" max="${data.maxDate}" aria-describedby="period-error"></label></div><div class="period-tag">Período selecionado<span>${valid?`${integer.format(periodDays)} dias com apontamentos`:'Verifique as datas'}</span></div><button class="ghost" data-action="reset">${icon('reset')}Limpar filtros</button></section><div id="period-error" class="filter-error" ${valid?'hidden':''} role="alert">Escolha datas válidas. A data inicial deve ser anterior ou igual à data final.</div>
<section class="metrics" aria-label="Totais do período"><article class="metric primary"><div class="metric-label">Horas no período<span class="metric-icon">${icon('clock')}</span></div><div class="metric-value" id="hours-total">${nf.format(hours)} <small>h</small></div><div class="metric-note">Soma das disciplinas selecionadas</div></article><article class="metric"><div class="metric-label">Disciplinas no período<span class="metric-icon">${icon('layers')}</span></div><div class="metric-value">${integer.format(discCount)}</div><div class="metric-note">Com horas no intervalo escolhido</div></article><article class="metric"><div class="metric-label">Apontamentos<span class="metric-icon">${icon('file')}</span></div><div class="metric-value" id="records-total">${integer.format(records)}</div><div class="metric-note">Registros na base selecionada</div></article></section>
<section class="discipline-panel" aria-label="Filtro de disciplinas"><div class="section-heading"><div><h2>Disciplinas</h2><p>Selecione uma ou mais para somar as horas.</p></div><div class="selection-note" aria-live="polite">${escape(selectedLabel)}</div></div><div class="chips"><button class="all-chip ${state.disc.length?'':'active'}" data-action="all" aria-pressed="${!state.disc.length}">Todas</button>${available.map(i=>`<button class="disc-chip ${state.disc.includes(i)?'selected':''}" data-action="discipline" data-value="${i}" title="${escape(data.disciplines[i])}" aria-label="${escape(data.disciplines[i])}" aria-pressed="${state.disc.includes(i)}">${escape(sigla(data.disciplines[i]))}</button>`).join('')}${state.disc.length?'<button class="small-text-button" data-action="all">Limpar seleção</button>':''}</div></section>
<div class="chart-grid" style="${state.project!==''?'grid-template-columns:1fr':''}">${state.project===''?`<section class="panel"><div class="panel-top"><div><h2>Horas por projeto</h2><p class="panel-sub">Distribuição no período selecionado</p></div><span class="panel-tag">${state.project===''?data.projects.length+' projetos':'Projeto atual'}</span></div>${horizontal(groupHours(rows,1),'project')}<div class="panel-foot">Clique em uma barra para abrir o projeto.</div></section>`: ''}<section class="panel"><div class="panel-top"><div><h2>Horas por disciplina</h2><p class="panel-sub">Distribuição no período selecionado</p></div><span class="panel-tag">Horas</span></div>${horizontal(groupHours(rows,2),'discipline')}<div class="panel-foot">Clique em uma barra para selecionar a disciplina.</div></section></div>

function tableRows(rows){const q=search.trim().toLocaleLowerCase('pt-BR');return rows.filter(r=>!q||[date(r[0]),data.projects[r[1]],data.disciplines[r[2]]].join(' ').toLocaleLowerCase('pt-BR').includes(q)).sort((a,b)=>b[0].localeCompare(a[0])||a[1]-b[1]||a[2]-b[2])}
function tableHTML(rows){const all=tableRows(rows),pages=Math.max(1,Math.ceil(all.length/pageSize));page=Math.min(page,pages);const slice=all.slice((page-1)*pageSize,page*pageSize);return `<div class="table-wrap"><table><thead><tr><th scope="col">Data</th><th scope="col">Projeto</th><th scope="col">Disciplina</th><th scope="col" class="record-count">Apontamentos</th><th scope="col">Horas</th></tr></thead><tbody>${slice.map(r=>`<tr><td>${date(r[0])}</td><td><span class="table-project">${data.projects[r[1]]}</span></td><td><span class="disc-cell">${sigla(data.disciplines[r[2]])}</span>${escape(discName(data.disciplines[r[2]]))}</td><td class="record-count">${integer.format(r[4])}</td><td class="hours-cell">${nf.format(r[3]/1e6)} h</td></tr>`).join('')||'<tr><td colspan="5"><div class="no-data">Nenhum apontamento para os filtros escolhidos.</div></td></tr>'}</tbody></table></div><div class="pagination"><span>${all.length?`${(page-1)*pageSize+1}–${Math.min(page*pageSize,all.length)} de ${integer.format(all.length)} linhas`:'0 linhas'}<br>${nf.format(sumHours(all))} h nos resultados</span><div class="page-buttons"><button class="ghost" data-action="prev" ${page===1?'disabled':''}>Anterior</button><span>${page} / ${pages}</span><button class="ghost" data-action="next" ${page===pages?'disabled':''}>Próxima</button></div></div>`}
function exportCSV(){const rows=tableRows(periodRows(contextRows(data,state.project,state.disc),state.start,state.end));const csv=[['Data','Projeto','Disciplina','Apontamentos','Horas'],...rows.map(r=>[date(r[0]),data.projects[r[1]],data.disciplines[r[2]],r[4],(r[3]/1e6).toFixed(6).replace('.',',')])].map(row=>row.map(c=>'"'+String(c).replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`apontamentos_${state.start}_${state.end}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const {action,value}=b.dataset;if(action==='daily'){document.getElementById('daily').scrollIntoView({behavior:'smooth'});return}if(action==='export'){exportCSV();return}if(action==='project'){state.project=value;const possible=new Set(contextRows(data,state.project).map(r=>r[2]));state.disc=state.disc.filter(i=>possible.has(i));page=1;search='';window.scrollTo({top:0,behavior:'smooth'})}else if(action==='discipline'){const i=Number(value);state.disc=state.disc.includes(i)?state.disc.filter(d=>d!==i):[...state.disc,i];page=1}else if(action==='all'){state.disc=[];page=1}else if(action==='reset'){state={...defaults(),project:state.project};search='';page=1}else if(action==='prev')page--;else if(action==='next')page++;render();if(action==='prev'||action==='next')document.getElementById('daily').scrollIntoView({behavior:'smooth',block:'start'})});
root.addEventListener('change',e=>{const id=e.target.id;if(['start','end','week','month'].includes(id)){state[id]=e.target.value;page=1;render()}});
let timer;root.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;page=1;clearTimeout(timer);timer=setTimeout(render,180)}});
